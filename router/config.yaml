model_list:
- model_name: jev
  litellm_params:
    model: auto_router/complexity_router
    complexity_router_config:
      classifier_type: custom
      classifier_plugin: jev_classifier.jev_classifier
      tier_definitions:
      - name: GENERAL_EFFICIENT
        description: Routine general-purpose work. Solver must normally answer the tiny health probe within 1.5s
          and remain below a 4s hard probe ceiling. Requires strong instruction following, structured output competence,
          >=128K context, and >=98% target availability.
      - name: GENERAL_CAPABLE
        description: Difficult general-purpose work where materially stronger quality justifies more latency. Target
          <=3s, hard probe ceiling 8s, >=98% target availability, strong synthesis and ambiguity handling.
      - name: REASONING_EFFICIENT
        description: Straightforward planning, diagnosis and tradeoff reasoning. Target <=2s, hard probe ceiling
          5s, >=98% target availability, with strong multi-step reasoning.
      - name: REASONING_CAPABLE
        description: Deep causal reasoning, architecture, uncertainty and difficult planning. Target <=4s, hard
          probe ceiling 10s, >=97.5% target availability, and materially stronger reasoning quality.
      - name: AGENTIC_EFFICIENT
        description: Short reliable tool workflows and simple delegation. Target <=1.5s, hard probe ceiling 4s,
          >=98% target availability. Must reliably follow tool/JSON schemas and handle a few dependent actions.
      - name: AGENTIC_CAPABLE
        description: Long-horizon or branching tool execution, recovery and orchestration. Target <=3s, hard probe
          ceiling 8s, >=97.5% target availability, strong tool use and recovery behavior.
      - name: CODING_EFFICIENT
        description: Small fixes, tests and bounded refactors. Target <=1.5s, hard probe ceiling 4s, >=98% target
          availability, strong code generation/editing and instruction following.
      - name: CODING_CAPABLE
        description: Hard debugging, cross-file implementation, architecture plus implementation, concurrency or
          distributed systems. Target <=3s, hard probe ceiling 8s, >=97.5% target availability, materially stronger
          software-engineering quality than the efficient tier.
      tiers:
        GENERAL_EFFICIENT: free-general-efficient
        GENERAL_CAPABLE: free-general-capable
        REASONING_EFFICIENT: free-reasoning-efficient
        REASONING_CAPABLE: free-reasoning-capable
        AGENTIC_EFFICIENT: free-agentic-efficient
        AGENTIC_CAPABLE: free-agentic-capable
        CODING_EFFICIENT: free-coding-efficient
        CODING_CAPABLE: free-coding-capable
      fallback_tier: GENERAL_CAPABLE
- model_name: free-general-efficient
