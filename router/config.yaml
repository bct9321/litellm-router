# Free-first callback routing; subscription model access remains live-unverified.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
litellm_settings:
  check_provider_endpoint: true
  drop_params: true
  callbacks:
  - router.jev_router.proxy_handler_instance
  custom_provider_map:
  - provider: jev_guard
    custom_handler: router.jev_router.entrypoint_guard
router_settings:
  num_retries: 0
  allowed_fails: 2
  cooldown_time: 15
  fallbacks:
